services:
  maintainer:
    build:
      context: .
      args:
        RUNTIME_IMAGE: ${MAINTAINER_RUNTIME_IMAGE:-rust:1.89-slim-bookworm}
        INSTALL_CODEX: ${MAINTAINER_INSTALL_CODEX:-true}
    user: "${MAINTAINER_UID:-1000}:${MAINTAINER_GID:-1000}"
    init: true
    working_dir: /repository
    command: [check]
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      SDK_MAINTENANCE_API_KEY: ${SDK_MAINTENANCE_API_KEY:-}
      MAINTENANCE_API_KEY: ${MAINTENANCE_API_KEY:-}
      CODEX_API_KEY: ${CODEX_API_KEY:-}
    volumes:
      - type: bind
        source: ${REPOSITORY_PATH:-.}
        target: /repository
        read_only: true
      - type: bind
        source: ${MAINTAINER_OUTPUT_PATH:-./.maintainer-output}
        target: /output
