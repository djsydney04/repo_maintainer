# Copy to .maintainer.yml in the repository you want to maintain.
version: 1
name: Repository maintenance
agent:
  runner: codex                # codex or builtin (direct model APIs)
  allow_paid: true              # Explicit account-usage opt-in for Codex/OpenAI/Anthropic.
  timeout_seconds: 1200
  # model: your-model           # Omit to use Codex's default model.
  # codex:
  #   binary: codex             # Executable on PATH, or an absolute path.
  #   sandbox: workspace-write

instructions: |
  Inspect this repository for a small, useful maintenance improvement.
  Preserve its conventions and public behavior. Add tests for behavior changes.
  Use the configured checks. Leave the repository unchanged if no work is needed.

# Optional: read documentation before each run. Leave empty for repository-only work.
sources: []

editable:
  root_files: [README.md]
  markdown_dirs: [docs]
  source_dirs: [src, tests]
  extensions: [.rs, .py, .js, .jsx, .ts, .tsx, .go, .md, .json]

validation:
  profile: custom               # rust retains the bundled Cargo validation suite.
  # Add dependency installation commands here when needed (e.g. npm ci).
  setup: []
  checks:
    - name: whitespace
      command: [git, diff, --check]
      timeout_seconds: 60
    # Add your repository's test/lint/build commands before unattended code work.
    # - name: tests
    #   command: [npm, test]
    #   working_directory: .
    #   timeout_seconds: 300
