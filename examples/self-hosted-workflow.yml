# Commit a copy under .github/workflows/ in the repository you want to maintain.
# Review the pinned commit; update both full SHA references together when upgrading.
name: Scheduled repository maintenance
on:
  schedule:
    - cron: '0 9 * * 1'
      timezone: America/Los_Angeles
  workflow_dispatch:
permissions:
  contents: read
jobs:
  maintain:
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
    uses: djsydney04/repo_maintainer/.github/workflows/maintain.yml@64c3d4e5c76f67bc378b18cbb297a3a5ca69ee5a
    with:
      maintainer_ref: 64c3d4e5c76f67bc378b18cbb297a3a5ca69ee5a
      config_path: .maintainer.yml
      runner_labels: '["self-hosted", "linux", "x64", "repo-maintainer"]'
      install_codex: true
    secrets:
      CODEX_API_KEY: ${{ secrets.CODEX_API_KEY }}
