name: Dependency merge policy tests
on:
  push:
    branches: [main]
    paths:
      - .github/actions/dependency-automerge/**
      - .github/workflows/dependency-policy-tests.yml
  pull_request:
    paths:
      - .github/actions/dependency-automerge/**
      - .github/workflows/dependency-policy-tests.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: node --test .github/actions/dependency-automerge/automerge.test.cjs
      - name: Exercise the composite action with a non-merge event
        id: smoke
        uses: ./.github/actions/dependency-automerge
      - name: Confirm the action skipped merging
        env:
          RESULT: ${{ steps.smoke.outputs.result }}
        run: test "$RESULT" = skipped
