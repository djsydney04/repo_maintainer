name: Maintainer checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: maintainer-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    name: Select checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
    outputs:
      rust: ${{ steps.changes.outputs.rust }}
      docker: ${{ steps.changes.outputs.docker }}
      workflows: ${{ steps.changes.outputs.workflows }}
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select checks from the complete change
        id: changes
        run: bash .github/scripts/ci-changes.sh "$BASE_REF" >> "$GITHUB_OUTPUT"
      - name: Check whitespace and the change selector
        run: |
          if base_commit=$(git rev-parse --verify --end-of-options "$BASE_REF^{commit}" 2>/dev/null); then
            git diff --check "$base_commit" HEAD --
          else
            git show --format= --check HEAD
          fi
          bash .github/scripts/test-ci-changes.sh
      - name: Select compatibility targets
        id: targets
        run: |
          targets='{"os":"ubuntu-latest","toolchain":"stable","lint":true},{"os":"ubuntu-latest","toolchain":"1.89.0","lint":false},{"os":"macos-latest","toolchain":"stable","lint":false}'
          if [[ "$GITHUB_EVENT_NAME" != pull_request ]]; then
            targets+=',{"os":"macos-latest","toolchain":"1.89.0","lint":false}'
          fi
          echo "matrix={\"include\":[$targets]}" >> "$GITHUB_OUTPUT"
  rust:
    name: Rust (${{ matrix.os }}, ${{ matrix.toolchain }})
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.toolchain }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      - name: Install lint tools
        if: matrix.lint
        run: rustup component add rustfmt clippy --toolchain "$RUSTUP_TOOLCHAIN"
      - name: Restore Rust dependencies and build artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: ${{ matrix.toolchain }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Format and lint once
        if: matrix.lint
        run: |
          cargo fmt --all --check
          cargo clippy --locked --all-targets -- -D warnings
      - name: Test and validate configuration without API credentials
        run: |
          env -u GITHUB_OUTPUT cargo test --locked
          cargo run --locked -- check --config maintainer.example.yml
  docker:
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    name: Docker (${{ matrix.runtime }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: generic
            image: debian:bookworm-slim
          - runtime: rust
            image: rust:1.89-slim-bookworm
          - runtime: node
            image: node:24-bookworm
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker compose config --quiet
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build and load the cached runtime with native Codex
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        env:
          DOCKER_BUILD_RECORD_UPLOAD: 'false'
        with:
          context: .
          build-args: RUNTIME_IMAGE=${{ matrix.image }}
          load: true
          tags: repo-maintainer:test
          cache-from: type=gha,scope=maintainer-image-${{ matrix.runtime }}
          cache-to: ${{ github.ref == 'refs/heads/main' && format('type=gha,scope=maintainer-image-{0},mode=max', matrix.runtime) || '' }}
      - name: Validate YAML without an API key
        run: docker run --rm --volume "$PWD:/repository:ro" repo-maintainer:test check --config maintainer.example.yml
      - name: Check Rust tools as the container user
        if: matrix.runtime == 'rust'
        run: |
          docker run --rm --entrypoint cargo repo-maintainer:test --version
          docker run --rm --entrypoint cargo repo-maintainer:test fmt --version
      - name: Verify Codex's native binary
        run: docker run --rm --entrypoint codex repo-maintainer:test --version
      - name: Verify the default worker's private networking and TLS
        if: matrix.runtime == 'generic'
        run: python3 scripts/container-network-smoke.py
      - name: Validate optional networking overlays
        env:
          MAINTAINER_PRIVATE_NETWORK: fixture-private-network
          MAINTAINER_CA_BUNDLE: /tmp/fixture-ca-bundle.pem
          MAINTAINER_DNS_SERVER: 10.0.0.53
        run: docker compose -f compose.yml -f compose.private-network.yml -f compose.ca.yml -f compose.dns.yml config --quiet
      - name: Verify a Node worker without Cargo
        if: matrix.runtime == 'node'
        run: |
          docker run --rm --entrypoint sh repo-maintainer:test -c 'node --version && ! command -v cargo'
          docker run --rm --volume "$PWD:/repository:ro" repo-maintainer:test check --config examples/node.yml
      - name: Run a real Node project's configured checks without Cargo
        if: matrix.runtime == 'node'
        run: |
          docker run --rm -i --entrypoint sh repo-maintainer:test <<'SH'
          set -eu
          project="$(mktemp -d)"
          cd "$project"
          printf '%s\n' '{"scripts":{"test":"node --test"}}' > package.json
          printf '%s\n' 'const test = require("node:test"); const assert = require("node:assert/strict"); test("contract", () => assert.equal(1 + 1, 2));' > contract.test.js
          printf '%s\n' '{"validation":{"profile":"custom","checks":[{"name":"tests","command":["npm","test"]}]}}' > .maintainer.yml
          repo-maintainer validate --repo "$project"
          SH
  workflows:
    name: Workflow syntax
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate workflows with pinned actionlint
        run: |
          cd "$RUNNER_TEMP"
          curl --fail --location --silent --show-error --retry 3 \
            --output actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz' | sha256sum --check
          tar -xzf actionlint.tar.gz actionlint
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/actionlint"
  ci:
    name: CI
    needs: [changes, rust, docker, workflows]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every selected check to pass
        env:
          SELECT_RESULT: ${{ needs.changes.result }}
          RUST_REQUIRED: ${{ needs.changes.outputs.rust }}
          RUST_RESULT: ${{ needs.rust.result }}
          DOCKER_REQUIRED: ${{ needs.changes.outputs.docker }}
          DOCKER_RESULT: ${{ needs.docker.result }}
          WORKFLOWS_REQUIRED: ${{ needs.changes.outputs.workflows }}
          WORKFLOWS_RESULT: ${{ needs.workflows.result }}
        run: |
          for required in "$RUST_REQUIRED" "$DOCKER_REQUIRED" "$WORKFLOWS_REQUIRED"; do
            if [[ "$required" != true && "$required" != false ]]; then
              echo 'Missing check-selection output.' >&2
              exit 1
            fi
          done
          if [[ "$SELECT_RESULT" != success ||
                ("$RUST_REQUIRED" == true && "$RUST_RESULT" != success) ||
                ("$DOCKER_REQUIRED" == true && "$DOCKER_RESULT" != success) ||
                ("$WORKFLOWS_REQUIRED" == true && "$WORKFLOWS_RESULT" != success) ]]; then
            echo 'A selected CI check did not pass.' >&2
            exit 1
          fi
