name: Maintainer checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: python3 -m pip install --disable-pip-version-check -r requirements.txt
      - run: python3 -m unittest discover -s tests -v
      - run: npm ci --prefix agent --ignore-scripts --no-audit --no-fund
      - run: npm test --prefix agent
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: docker compose config --quiet
      - run: docker build --tag repo-maintainer:test .
      - name: Check YAML in the built image without an API key
        run: docker run --rm --volume "$PWD:/repository:ro" repo-maintainer:test check --config maintainer.example.yml
      - name: Verify SDK transports and policies in the image
        run: docker run --rm --entrypoint node repo-maintainer:test --test /opt/maintainer/agent/agent.test.mjs /opt/maintainer/agent/providers.test.mjs
      - name: Check the Rust toolchain as the container user
        run: docker run --rm --entrypoint cargo repo-maintainer:test --version
