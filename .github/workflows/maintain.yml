name: Reusable repository maintenance
on:
  workflow_call:
    inputs:
      maintainer_ref:
        description: Exact repo_maintainer commit (same SHA as the caller's uses reference)
        required: true
        type: string
      config_path:
        type: string
        default: .github/maintainer.json
      provider:
        type: string
        default: ''
      model:
        type: string
        default: ''
      allow_paid:
        description: Explicitly allow a paid provider (or set agent.allow_paid in YAML)
        type: boolean
        default: false
      owner:
        type: string
        default: ''
      runner_labels:
        description: JSON array of GitHub runner labels; use self-hosted labels for your infrastructure
        type: string
        default: '["ubuntu-latest"]'
      agent_runner:
        description: Optional builtin or codex override
        type: string
        default: ''
      install_codex:
        description: Install the pinned native Codex binary for the proposal job
        type: boolean
        default: false
    secrets:
      GEMINI_API_KEY:
        required: false
      GROQ_API_KEY:
        required: false
      OPENAI_API_KEY:
        required: false
      ANTHROPIC_API_KEY:
        required: false
      SDK_MAINTENANCE_API_KEY:
        required: false
      MAINTENANCE_API_KEY:
        required: false
      CODEX_API_KEY:
        required: false
permissions:
  contents: read
concurrency:
  group: repository-maintenance-${{ inputs.config_path }}
  cancel-in-progress: false
env:
  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
  MAINTENANCE_OWNER: ${{ inputs.owner || github.repository_owner }}
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
  MAINTENANCE_PROVIDER: ${{ inputs.provider }}
  MAINTENANCE_RUNNER: ${{ inputs.agent_runner }}
  MAINTENANCE_MODEL: ${{ inputs.model }}
  MAINTENANCE_ALLOW_PAID: ${{ inputs.allow_paid && 'true' || '' }}
  MAINTENANCE_CONFIG: ${{ github.workspace }}/consumer/${{ inputs.config_path }}
  MAINTENANCE_REPOSITORY_ROOT: ${{ github.workspace }}/consumer
jobs:
  propose:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ${{ fromJSON(inputs.runner_labels) }}
    timeout-minutes: 90
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      sha: ${{ steps.prepare.outputs.sha }}
      status: ${{ steps.collect.outputs.status }}
      msrv: ${{ steps.prepare.outputs.msrv }}
      package_check: ${{ steps.prepare.outputs.package_check }}
      validation_profile: ${{ steps.prepare.outputs.validation_profile }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: djsydney04/repo_maintainer
          ref: ${{ inputs.maintainer_ref }}
          path: automation
          persist-credentials: false
      - name: Build the Rust maintainer
        run: |
          rustup toolchain install stable --profile minimal
          cargo +stable build --release --locked --manifest-path automation/Cargo.toml
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: consumer
          persist-credentials: false
      - name: Read official docs and existing maintenance feedback
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          automation/target/release/repo-maintainer prepare
          --artifacts "$RUNNER_TEMP/proposal"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: source
        with:
          ref: ${{ steps.prepare.outputs.sha }}
          path: source
          persist-credentials: false
      - name: Install Rust check tools
        if: steps.prepare.outputs.validation_profile == 'rust'
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup component add rustfmt clippy
      - name: Install the native Codex binary
        if: steps.prepare.outputs.runner == 'codex' && inputs.install_codex
        run: |
          bash automation/scripts/install-codex.sh "$RUNNER_TEMP/maintainer-tools/bin"
          echo "$RUNNER_TEMP/maintainer-tools/bin" >> "$GITHUB_PATH"
      - name: Prepare repository dependencies
        run: automation/target/release/repo-maintainer setup --source source
      - name: Inspect, edit, test and repair using the selected coding agent
        id: agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SDK_MAINTENANCE_API_KEY: ${{ secrets.SDK_MAINTENANCE_API_KEY }}
          MAINTENANCE_API_KEY: ${{ secrets.MAINTENANCE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CODEX_API_KEY: ${{ secrets.CODEX_API_KEY }}
        run: |
          status=0
          automation/target/release/repo-maintainer agent \
            --source source --prompt "$RUNNER_TEMP/proposal/brief.md" \
            > "$RUNNER_TEMP/agent-result.json" 2> "$RUNNER_TEMP/agent-stderr.log" || status=$?
          echo "exit-code=$status" >> "$GITHUB_OUTPUT"
      - name: Verify the proposal boundary and structured result
        id: collect
        if: always() && steps.agent.outcome == 'success'
        env:
          AGENT_EXIT_CODE: ${{ steps.agent.outputs.exit-code }}
        run: >-
          automation/target/release/repo-maintainer collect
          --source source --artifacts "$RUNNER_TEMP/proposal"
          --raw "$RUNNER_TEMP/agent-result.json" --exit-code "$AGENT_EXIT_CODE"
      - name: Retain completed or partial proposals
        if: always() && steps.prepare.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: repository-maintenance-proposal
          path: |
            ${{ runner.temp }}/proposal/request.json
            ${{ runner.temp }}/proposal/report.json
            ${{ runner.temp }}/proposal/proposal.patch
          retention-days: 30
          if-no-files-found: error
  validate:
    needs: propose
    if: needs.propose.outputs.status == 'changed'
    runs-on: ${{ fromJSON(inputs.runner_labels) }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: djsydney04/repo_maintainer
          ref: ${{ inputs.maintainer_ref }}
          path: automation
          persist-credentials: false
      - name: Build the Rust maintainer
        run: |
          rustup toolchain install stable --profile minimal
          cargo +stable build --release --locked --manifest-path automation/Cargo.toml
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: consumer
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.propose.outputs.sha }}
          path: source
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: repository-maintenance-proposal
          path: ${{ runner.temp }}/proposal
      - run: automation/target/release/repo-maintainer apply --source source --artifacts "$RUNNER_TEMP/proposal"
      - name: Install validation tools
        if: needs.propose.outputs.validation_profile == 'rust'
        env:
          RUST_MSRV: ${{ needs.propose.outputs.msrv }}
        run: |
          rustup toolchain install stable "$RUST_MSRV" --profile minimal
          rustup default stable
          rustup component add rustfmt clippy
          cargo install cargo-audit --version 0.22.2 --locked
      - name: Run configured checks and record validation of this exact patch
        run: automation/target/release/repo-maintainer validate --source source --artifacts "$RUNNER_TEMP/proposal"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: repository-maintenance-validation
          path: ${{ runner.temp }}/proposal/validation.json
          retention-days: 30
          if-no-files-found: error
  publish:
    needs: [propose, validate]
    runs-on: ${{ fromJSON(inputs.runner_labels) }}
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: djsydney04/repo_maintainer
          ref: ${{ inputs.maintainer_ref }}
          path: automation
          persist-credentials: false
      - name: Build the Rust maintainer
        run: |
          rustup toolchain install stable --profile minimal
          cargo +stable build --release --locked --manifest-path automation/Cargo.toml
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: consumer
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.propose.outputs.sha }}
          path: source
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: repository-maintenance-proposal
          path: ${{ runner.temp }}/proposal
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: repository-maintenance-validation
          path: ${{ runner.temp }}/proposal
      - name: Open or update a PR and dispatch full CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: automation/target/release/repo-maintainer publish --source source --artifacts "$RUNNER_TEMP/proposal"
  notify:
    needs: [propose, validate, publish]
    if: always() && github.ref_name == github.event.repository.default_branch
    runs-on: ${{ fromJSON(inputs.runner_labels) }}
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: djsydney04/repo_maintainer
          ref: ${{ inputs.maintainer_ref }}
          path: automation
          persist-credentials: false
      - name: Build the Rust maintainer
        run: |
          rustup toolchain install stable --profile minimal
          cargo +stable build --release --locked --manifest-path automation/Cargo.toml
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: consumer
          persist-credentials: false
      - name: Read the report if one was produced
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: repository-maintenance-proposal
          path: ${{ runner.temp }}/proposal
      - name: Notify only for a new blocker or a recovered run
        env:
          GH_TOKEN: ${{ github.token }}
          PROPOSE_RESULT: ${{ needs.propose.result }}
          VALIDATE_RESULT: ${{ needs.validate.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
        run: automation/target/release/repo-maintainer notify --artifacts "$RUNNER_TEMP/proposal"
