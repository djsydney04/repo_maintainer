name: Dependency auto-merge
description: Merge eligible Dependabot updates through GitHub's required checks, without inference
inputs:
  allow-minor:
    description: Also allow minor updates; major and unknown updates always need review
    default: 'false'
outputs:
  result:
    description: requested, already-enabled, or skipped
    value: ${{ steps.merge.outputs.decision }}
runs:
  using: composite
  steps:
    - name: Read verified Dependabot metadata
      id: metadata
      if: >-
        github.event_name == 'pull_request_target' &&
        github.event.pull_request.user.login == 'dependabot[bot]' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.base.ref == github.event.repository.default_branch &&
        !github.event.pull_request.draft
      uses: dependabot/fetch-metadata@21025c705c08248db411dc16f3619e6b5f9ea21a # v2
      with:
        github-token: ${{ github.token }}
    - name: Apply the dependency merge policy
      id: merge
      uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
      env:
        GH_TOKEN: ${{ github.token }}
        DEPENDENCY_ACTION_PATH: ${{ github.action_path }}
        DEPENDENCY_ALLOW_MINOR: ${{ inputs.allow-minor }}
        DEPENDENCY_METADATA: ${{ steps.metadata.outputs.updated-dependencies-json }}
      with:
        script: |
          const merge = require(`${process.env.DEPENDENCY_ACTION_PATH}/automerge.cjs`);
          await merge({github, context, core, exec}, {
            allowMinor: process.env.DEPENDENCY_ALLOW_MINOR,
            metadata: process.env.DEPENDENCY_METADATA,
          });
